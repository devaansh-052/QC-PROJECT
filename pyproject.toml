[build-system]
requires = ["setuptools==65.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-fraud"
version = "0.1.0"
description = "Reproducible hybrid quantum-classical fraud detection research"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6", "PyYAML==6.0.3", "pandas==2.2.2", "matplotlib==3.10.7",
  "scikit-learn==1.4.2", "joblib==1.5.2", "xgboost==3.1.1",
  "qiskit==2.5.2", "qiskit-machine-learning==0.9.1", "qiskit-aer==0.17.2",
  "torch==2.10.0", "qiskit-ibm-runtime==0.49.0",
  "fastapi==0.141.1", "uvicorn==0.53.0", "requests==2.34.2", "streamlit==1.64.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
